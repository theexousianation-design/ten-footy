<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEN Footy · Previews, Analysis, Predictions</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--tx:#111;--mu:#6b7280;--or:#ff6a00;--bd:#e4e4e7;--d:#9ca3af;--a:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#17171a;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2a2a2e;--d:#52525b;--a:#e4e4e7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#17171a;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2a2a2e;--d:#52525b;--a:#e4e4e7;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Helvetica Neue",Arial,system-ui,sans-serif}
header{background:#000;color:#fff}.in{max-width:900px;margin:0 auto;padding:14px 16px 8px;display:flex;align-items:center;gap:12px}
.logo{height:42px}.brand b{font-size:22px;font-weight:800;letter-spacing:.3px;color:var(--or);display:block;line-height:1.1}.brand small{color:#bbb;font-size:12px}
#lg{max-width:900px;margin:0 auto;padding:6px 16px 12px;display:flex;gap:8px;overflow-x:auto}
#lg button{white-space:nowrap;border:1px solid #333;background:#111;color:#fff;padding:7px 13px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
#lg button.on{background:var(--or);border-color:var(--or);color:#000;font-weight:700}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:20px;font-weight:800;margin:22px 0 4px;border-left:5px solid var(--or);padding-left:10px}
.sub,.mu{color:var(--mu);font-size:13px}.sub{margin:0 0 12px 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mc,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.mc{border-top:4px solid var(--or)}.t{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.tm{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px;font-size:16px}.tm b{flex:1}.tm b:last-child{text-align:right}
.sc{background:#000;color:var(--or);font-weight:800;padding:2px 10px;border-radius:6px;white-space:nowrap}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0;font-size:11px;font-weight:700}.bar div{display:flex;align-items:center;justify-content:center}
.sbox{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mu)}th:nth-child(2),td:nth-child(2){text-align:left}tr.top td:first-child{border-left:4px solid var(--or)}
.er{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}.er span:first-child{width:110px}.eb{height:14px;background:var(--or);border-radius:4px}
footer{max-width:900px;margin:30px auto 20px;padding:16px;border-top:1px solid var(--bd);color:var(--mu);font-size:13px}footer b{color:var(--or)}
</style></head><body>
<header><div class="in">
<svg class="logo" viewBox="0 0 108 100" role="img" aria-label="TEN Footy mark"><rect x="0" y="0" width="79" height="17" fill="#ff6a00"/><rect x="29.5" y="0" width="22" height="100" fill="#ff6a00"/><g fill="#fff"><rect x="55.5" y="24" width="16" height="76"/><rect x="55.5" y="24" width="52" height="13"/><rect x="55.5" y="55" width="47" height="13"/></g><circle cx="83" cy="90" r="9.5" fill="#ff6a00"/></svg>
<div class="brand"><b>TEN Footy</b><small>Previews · Analysis · Predictions</small></div></div>
<nav id="lg"></nav></header>
<main id="m"></main>
<footer><b>TEN Footy</b> · a subsidiary of The Exousia Nation<br>Predictions come from a statistical model and are for information and entertainment only. They are not betting advice.</footer>
<script>
var LG=[["PL","Premier League"],["PD","La Liga"],["SA","Serie A"],["BL1","Bundesliga"],["FL1","Ligue 1"],["CL","Champions League"]],cur="PL",D={};
var $=function(i){return document.getElementById(i)};
function pois(l,k){var r=Math.exp(-l);for(var i=1;i<=k;i++)r*=l/i;return r}
function pc(x){return Math.round(x*100)}
function build(d){var M={E:{},N:{},T:{},att:{},def:{}},hg=0,ag=0,n=0;
 d.table.forEach(function(r){M.N[r.t]=r.n;M.T[r.t]=r;M.E[r.t]=1500});
 d.finished.slice().sort(function(a,b){return a.d<b.d?-1:1}).forEach(function(g){var E=M.E;if(E[g.h]==null||E[g.a]==null)return;
  var dr=E[g.h]+65-E[g.a],we=1/(Math.pow(10,-dr/400)+1),W=g.hg>g.ag?1:g.hg==g.ag?.5:0,k=Math.abs(g.hg-g.ag),G=k<2?1:k==2?1.5:(11+k)/8,dl=30*G*(W-we);
  E[g.h]+=dl;E[g.a]-=dl;hg+=g.hg;ag+=g.ag;n++});
 M.hs=n?hg/n:1.5;M.as=n?ag/n:1.2;var mu=(M.hs+M.as)/2;
 d.table.forEach(function(r){var w=r.p/(r.p+6);M.att[r.t]=r.p?1+((r.gf/r.p)/mu-1)*w:1;M.def[r.t]=r.p?1+((r.ga/r.p)/mu-1)*w:1});
 return M}
function pred(M,h,a){var lh=M.att[h]*M.def[a]*M.hs,la=M.att[a]*M.def[h]*M.as,ro=-0.1,w=0,x=0,l=0,b=[0,0,0],t=0,i,j,p,tau;
 for(i=0;i<10;i++)for(j=0;j<10;j++){tau=1;if(i<2&&j<2)tau=i==0&&j==0?1-lh*la*ro:i==0?1+lh*ro:j==0?1+la*ro:1-ro;
  p=pois(lh,i)*pois(la,j)*tau;t+=p;if(i>j)w+=p;else if(i==j)x+=p;else l+=p;if(p>b[2])b=[i,j,p]}
 return{w:w/t,d:x/t,l:l/t,s:b[0]+"–"+b[1],lh:lh,la:la}}
function card(f,M){var p=pred(M,f.h,f.a),t=new Date(f.d).toLocaleString([],{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
 return'<div class="mc"><div class="t">'+t+'</div><div class="tm"><b>'+M.N[f.h]+'</b><span class="sc">'+p.s+'</span><b>'+M.N[f.a]+'</b></div>'+
 '<div class="bar"><div style="width:'+p.w*100+'%;background:var(--or);color:#000">'+pc(p.w)+'%</div><div style="width:'+p.d*100+'%;background:var(--d);color:#fff">'+pc(p.d)+'%</div><div style="width:'+p.l*100+'%;background:var(--a);color:var(--bg)">'+pc(p.l)+'%</div></div>'+
 '<div class="mu">Home win · Draw · Away win</div><div class="mu">Elo '+Math.round(M.E[f.h])+' vs '+Math.round(M.E[f.a])+' · expected goals '+p.lh.toFixed(1)+' – '+p.la.toFixed(1)+'</div></div>'}
function table(d,M){return'<div class="card sbox"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>Pts</th><th>Elo</th></tr>'+d.table.map(function(r,i){return'<tr'+(i<4&&d.code=="PL"?' class="top"':'')+'><td>'+(i+1)+'</td><td>'+r.n+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+r.gf+'</td><td>'+r.ga+'</td><td><b>'+r.pts+'</b></td><td>'+Math.round(M.E[r.t])+'</td></tr>'}).join('')+'</table></div>'}
function elo(M){var k=Object.keys(M.E).sort(function(x,y){return M.E[y]-M.E[x]}).slice(0,8),lo=1350;
 return'<div class="card">'+k.map(function(c){return'<div class="er"><span>'+M.N[c]+'</span><div class="eb" style="width:'+Math.max(8,(M.E[c]-lo)/3)+'px"></div><b>'+Math.round(M.E[c])+'</b></div>'}).join('')+'</div>'}
function show(code){var d=D[code],M=build(d),up=d.upcoming.filter(function(f){return M.N[f.h]&&M.N[f.a]}).slice(0,12);
 $("m").innerHTML='<h2>Next matches</h2><p class="sub">'+d.name+' · model predictions · data refreshed '+new Date(d.u).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+'</p>'+
 (up.length?'<div class="grid">'+up.map(function(f){return card(f,M)}).join('')+'</div>':'<div class="card">No upcoming matches listed right now.</div>')+
 '<h2>'+d.name+' table</h2><p class="sub">Goals data included · Elo built from every result this season</p>'+table(d,M)+'<h2>Elo power rankings</h2><p class="sub">Top 8 teams by Elo rating</p>'+elo(M)}
function load(){var code=cur,nav=$("lg");
 nav.innerHTML=LG.map(function(l){return'<button data-k="'+l[0]+'" class="'+(l[0]==code?"on":"")+'">'+l[1]+'</button>'}).join('');
 Array.prototype.forEach.call(nav.children,function(b){b.onclick=function(){location.hash=b.dataset.k}});
 if(D[code]){show(code);return}
 $("m").innerHTML='<div class="card">Loading live data…</div>';
 fetch("/api/league?code="+code).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j})})
 .then(function(j){D[code]=j;if(cur==code)show(code)})
 .catch(function(e){if(cur==code)$("m").innerHTML='<div class="card">Couldn’t load live data ('+e.message+'). Please try again in a few minutes.</div>'})}
function route(){var h=location.hash.slice(1);cur=LG.some(function(l){return l[0]==h})?h:"PL";load()}
window.onhashchange=route;route();
</script></body></html>
